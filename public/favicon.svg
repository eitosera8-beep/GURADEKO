<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Refined, harmonious gradient: Deep Indigo -> Violet -> Rose -->
    <linearGradient id="gradecoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <!-- Subtle inner bevel highlight -->
    <linearGradient id="bevelLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Clean rounded squircle canvas -->
  <rect x="32" y="32" width="448" height="448" rx="116" fill="url(#gradecoGrad)" />
  <rect x="32" y="32" width="448" height="448" rx="116" fill="none" stroke="url(#bevelLight)" stroke-width="3" />

  <!-- Crisp, minimalist geometric "G" monogram -->
  <path
    d="M 345 176 A 120 120 0 1 0 376 256 L 256 256"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="50"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
