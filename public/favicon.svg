<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#141527" />
      <stop offset="100%" stop-color="#241434" />
    </linearGradient>

    <!-- Outer Rim Highlight -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5" />
    </linearGradient>

    <!-- Main Gradient Ribbon: Fluid vibrant flow -->
    <linearGradient id="gGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="30%" stop-color="#4FACFE" />
      <stop offset="65%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <linearGradient id="gGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="45%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <!-- Sparkle / Accent Gradient -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="ambientBgGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
  </defs>

  <!-- Modern Rounded Squircle Base -->
  <rect x="20" y="20" width="472" height="472" rx="118" fill="url(#bgGrad)" />
  
  <!-- Subtle Border / Bevel Rim -->
  <rect x="20" y="20" width="472" height="472" rx="118" fill="none" stroke="url(#rimGrad)" stroke-width="4" />

  <!-- Ambient colorful glow behind the monogram -->
  <ellipse cx="256" cy="256" rx="130" ry="120" fill="url(#gGrad1)" opacity="0.32" filter="url(#ambientBgGlow)" />
  <ellipse cx="290" cy="270" rx="90" ry="80" fill="url(#gGrad2)" opacity="0.28" filter="url(#ambientBgGlow)" />

  <!-- Dynamic Gradeco Monogram "G" formed by flowing gradient ribbons -->
  <g filter="url(#softGlow)">
    <!-- Lower Arc of G (Orange to Rose/Violet) -->
    <path
      d="M 364 260 C 364 330 316 376 256 376 C 182 376 132 322 132 248 C 132 174 184 120 260 120 C 310 120 348 148 362 186"
      fill="none"
      stroke="url(#gGrad1)"
      stroke-width="50"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Inner horizontal bar and stem of G with warm glow -->
    <path
      d="M 252 260 L 364 260"
      fill="none"
      stroke="url(#gGrad2)"
      stroke-width="50"
      stroke-linecap="round"
    />
  </g>

  <!-- High-contrast crisp foreground pass for ultra-sharp small sizes (16px / 32px) -->
  <path
    d="M 364 260 C 364 330 316 376 256 376 C 182 376 132 322 132 248 C 132 174 184 120 260 120 C 310 120 348 148 362 186"
    fill="none"
    stroke="url(#gGrad1)"
    stroke-width="46"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M 252 260 L 364 260"
    fill="none"
    stroke="url(#gGrad2)"
    stroke-width="46"
    stroke-linecap="round"
  />

  <!-- Distinctive Accent: Star Sparkle / Color Prism dot at top right -->
  <g transform="translate(366, 126)">
    <path
      d="M 0 -22 C 0 -6 6 0 22 0 C 6 0 0 6 0 22 C 0 6 -6 0 -22 0 C -6 0 0 -6 0 -22 Z"
      fill="url(#sparkleGrad)"
    />
  </g>

  <!-- Accent dot inside the core loop -->
  <circle cx="210" cy="226" r="12" fill="#00F2FE" opacity="0.9" />
</svg>
